# Variants that run IN PARALLEL with each bot: same live market, their own
# paper trades, no Discord messages. They exist to compare, day by day, how
# another version of a strategy would have done next to the one the bot
# really trades. Their results show in the dashboard (Bots tab).
#
# To add one, copy a block and change it; to stop one, delete its block (its
# record stays in data_store/shadows/). Restart the bot to apply
# (bash deploy/macos/ctl.sh restart; ORBIT: ctl.sh orbit restart).
#
# ghost: strategy = a file in config/strategies/, overrides = changes on top.
# orbit: settings = changes to APERTURA's rules (opening_range.OrbSettings).

ghost:
  - id: zonas_1m
    name: "Zonas 1 min · de día"
    about: "La versión de 1 min tal cual corría (v2): zonas de 5 min, entrada con vela de 1 min, BE+2 al 70 %, 9:30–15:30."
    strategy: zones_1m

  - id: zonas_1m_noche
    name: "Zonas 1 min · día y noche"
    about: "La misma versión de 1 min, también de noche (como v3)."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"

orbit:
  - id: apertura_30m
    name: "APERTURA · caja 30 min"
    about: "La caja de 9:30 a 10:00 en vez de 9:45; todo lo demás igual."
    settings:
      range_minutes: 30

  - id: apertura_tp2
    name: "APERTURA · objetivo 2×"
    about: "La misma caja de 15 min con el objetivo a 2× el stop en vez de 1.5×."
    settings:
      target_mult: 2.0
