# Zone-retrace strategy (the live bot's default; BOT_STRATEGY=zones).
# Overlay on default.yaml: only what this strategy changes is listed here.
#
# Model: mark a fresh fair-value-gap zone on 5m, warn when price is coming back
# to it ("get ready"), and only trade the FIRST retrace if price reacts there on
# 1m. The plan is anchored at the zone midpoint (the "optimal" entry): stop
# beyond the origin of the move, 20-35 pts; TP1 at 1R (or a swing up to 2R),
# where the stop goes to breakeven; final target at the nearest untaken swing
# (2R-5R) or 3R. The paper fill is the confirmation close — what "take the
# entry now" really gets. Cut through without a reaction -> cancelled.
#
# NOT calibrated on real data yet: run scripts/audit_real_data.py on the Mac
# (it uses this same strategy) before trusting the numbers.

timeframe_roles:
  context: "1H"
  structure: "5m"
  execution: "1m"

analysis:
  max_bars: 1440                    # 24h of 1m: a whole trade date (VWAP), fast

setups:
  liquidity_sweep: {enabled: false}
  vwap_reclaim: {enabled: false}
  orb: {enabled: false}
  zone_retrace:
    enabled: true
    timeframe: "1m"
    zone_timeframe: "5m"
    zone_lookback_bars: 36          # zones from the last 3 hours
    min_zone_points: 3.0
    max_zone_points: 40.0
    min_stop_points: 20.0
    max_stop_points: 35.0
    stop_buffer_points: 1.0
    max_risk_points: 50.0
    arm_distance_points: 30.0
    confirm_bars: 5
    tp1_r: 1.0
    tp1_max_r: 2.0
    min_target_r: 2.0
    max_target_r: 5.0
    fallback_target_r: 3.0
    fixed_target_r: null            # e.g. 2.0 = fixed 2:1 (see backtest "Objetivos")
    single_target: false
    expiration_bars: 5

signals:
  # R:R is judged on the plan (midpoint entry); from a fill taken a few points
  # past the midpoint, TP1 at 1R is ~0.5-0.8R — TradingMind's own direct short
  # was 0.55R from "price now". Only reject plans worse than that.
  min_risk_reward: 0.5

ghost:
  min_rr: 0.5
  partial_at_tp1: 0.5               # bank half at target 1, run the rest
  # Flat by 16:55 ET, not 16:00: NQ trades until 17:00 and Apex only needs
  # the account flat before 16:59. Entries still stop at 15:30.
  eod_close_time: "16:55"
  # The operator always trades 5 micros: every $ figure is for 5 MNQ ($10/pt).
  contracts: 5
  trade_micro: true
  # The zone rules ARE the filter: no confluence gate, no ATR stop band (a
  # fixed 20-pt stop is ~2 ATR on 1m, which the 5m-era band would reject).
  # Session / 15:30 cut-off / 16:00 flat / one position / cooldown still apply.
  min_confluence_score: null
  min_stop_atr_mult: 0.0
  max_stop_atr_mult: 0.0
  cooldown_bars: 15                 # 15 minutes after a stop-out

output:
  notifications:
    trade_progress: false           # no R-milestone spam; TP1 + close only
    trade_ideas: true
    tp1_hit: true
