:root {
  color-scheme: light;

  --page: #F1F1F4;
  --surface: #FFFFFF;
  --surface-2: #FAFAFB;
  --sunken: #EAEAEE;
  --hairline: rgba(16, 18, 24, 0.10);
  --hairline-2: rgba(16, 18, 24, 0.19);
  --wash: rgba(16, 18, 24, 0.04);
  --wash-2: rgba(16, 18, 24, 0.07);

  --ink: #14161A;
  --ink-2: #545A66;
  --ink-3: #868C99;
  --ink-on-accent: #FFFFFF;
  --accent: #14161A;

  --good: #0CA30C;
  --good-ink: #006300;
  --warn: #FAB219;
  --warn-ink: #7A5200;
  --serious: #EC835A;
  --bad: #D03B3B;
  --bad-ink: #A82323;

  /* Categorical money palette — validated light steps, surface #FFFFFF */
  --s1: #2a78d6;  /* blue    */
  --s2: #eb6834;  /* orange  */
  --s3: #1baf7a;  /* aqua    */
  --s4: #eda100;  /* yellow  */
  --s5: #e87ba4;  /* magenta */
  --s6: #008300;  /* green   */
  --s7: #4a3aa7;  /* violet  */
  --s8: #e34948;  /* red     */
  --s0: #9AA0AC;  /* neutral — unallocated, never a category */

  --grid: #E7E7EC;
  --axis: #D3D4DA;
  --muted: #8A909C;

  --shadow-1: 0 1px 2px rgba(16, 18, 24, .05);
  --shadow-2: 0 1px 2px rgba(16, 18, 24, .06), 0 10px 30px -14px rgba(16, 18, 24, .28);
  --shadow-3: 0 2px 6px rgba(16, 18, 24, .08), 0 26px 60px -20px rgba(16, 18, 24, .38);

  --r-card: 14px;
  --r: 10px;
  --r-sm: 7px;
  --r-pill: 999px;

  --rail: 244px;
  --gutter: 22px;
  --max: 1240px;

  --sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Azeret Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --page: #0B0C0E;
    --surface: #15161A;
    --surface-2: #1B1D22;
    --sunken: #0F1013;
    --hairline: rgba(255, 255, 255, 0.09);
    --hairline-2: rgba(255, 255, 255, 0.17);
    --wash: rgba(255, 255, 255, 0.045);
    --wash-2: rgba(255, 255, 255, 0.085);

    --ink: #F5F6F8;
    --ink-2: #A5AAB6;
    --ink-3: #727888;
    --ink-on-accent: #0B0C0E;
    --accent: #F5F6F8;

    --good: #0CA30C;
    --good-ink: #2FC03A;
    --warn: #FAB219;
    --warn-ink: #F0AE21;
    --serious: #EC835A;
    --bad: #D03B3B;
    --bad-ink: #EC6E6E;

    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #008300;
    --s7: #9085e9;
    --s8: #e66767;
    --s0: #7C828F;

    --grid: #232429;
    --axis: #33353C;
    --muted: #898781;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -14px rgba(0, 0, 0, .9);
    --shadow-3: 0 2px 6px rgba(0, 0, 0, .55), 0 26px 60px -20px rgba(0, 0, 0, 1);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --page: #0B0C0E;
  --surface: #15161A;
  --surface-2: #1B1D22;
  --sunken: #0F1013;
  --hairline: rgba(255, 255, 255, 0.09);
  --hairline-2: rgba(255, 255, 255, 0.17);
  --wash: rgba(255, 255, 255, 0.045);
  --wash-2: rgba(255, 255, 255, 0.085);

  --ink: #F5F6F8;
  --ink-2: #A5AAB6;
  --ink-3: #727888;
  --ink-on-accent: #0B0C0E;
  --accent: #F5F6F8;

  --good: #0CA30C;
  --good-ink: #2FC03A;
  --warn: #FAB219;
  --warn-ink: #F0AE21;
  --serious: #EC835A;
  --bad: #D03B3B;
  --bad-ink: #EC6E6E;

  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --s7: #9085e9;
  --s8: #e66767;
  --s0: #7C828F;

  --grid: #232429;
  --axis: #33353C;
  --muted: #898781;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -14px rgba(0, 0, 0, .9);
  --shadow-3: 0 2px 6px rgba(0, 0, 0, .55), 0 26px 60px -20px rgba(0, 0, 0, 1);
}

/* --------------------------------------------------------------------------
   Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  font-weight: 400;
  letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; background: none; border: 0; padding: 0; }

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: var(--ink); color: var(--surface); }

/* Typographic utilities ---------------------------------------------------- */
.lbl {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.2;
}
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.money { font-variant-numeric: proportional-nums; letter-spacing: -0.03em; font-weight: 600; }
.sub { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.tnum { font-variant-numeric: tabular-nums; }
.pos { color: var(--good-ink); }
.neg { color: var(--bad-ink); }
.warnc { color: var(--warn-ink); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --------------------------------------------------------------------------
   App shell
   -------------------------------------------------------------------------- */
#app { min-height: 100dvh; }

.shell {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100dvh;
}

/* Left rail (Mac) ---------------------------------------------------------- */
.rail {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 22px 14px 18px;
  border-right: 1px solid var(--hairline);
  background: var(--page);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 8px 20px;
}
.brand-mark {
  width: 30px; height: 30px; flex: none;
  border-radius: 9px;
  background: var(--accent);
  color: var(--ink-on-accent);
  display: grid; place-items: center;
  font-weight: 700; font-size: 15px; letter-spacing: -0.05em;
}
.brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-name { display: block; font-weight: 600; font-size: 14.5px; letter-spacing: -0.02em; line-height: 1.15; }
.brand-sub {
  display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3); line-height: 1.2; white-space: nowrap;
}

.nav-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--r);
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  transition: background .16s var(--ease), color .16s var(--ease);
}
.nav-item svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav-item:hover { background: var(--wash); color: var(--ink); }
.nav-item[aria-current="page"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
  border: 1px solid var(--hairline);
  padding: 7px 9px;
}
.nav-item[aria-current="page"] svg { opacity: 1; }

.rail-spacer { flex: 1 1 auto; }

.rail-foot { display: flex; flex-direction: column; gap: 8px; padding: 0 2px; }

/* Content ------------------------------------------------------------------ */
.main { min-width: 0; padding: 0 var(--gutter) 80px; }
.wrap { max-width: var(--max); margin: 0 auto; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 18px 0 14px;
  background: linear-gradient(var(--page) 68%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
}
.topbar h1 { font-size: 21px; letter-spacing: -0.03em; }
.topbar-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* --------------------------------------------------------------------------
   Buttons & controls
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--hairline-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px; font-weight: 550;
  letter-spacing: -0.01em;
  white-space: nowrap;
  transition: transform .12s var(--ease), background .16s var(--ease), border-color .16s var(--ease), opacity .16s;
}
.btn:hover { background: var(--wash); }
.btn:active { transform: scale(.97); }
.btn svg { width: 15px; height: 15px; }

.btn-primary {
  background: var(--accent); color: var(--ink-on-accent); border-color: transparent;
  font-weight: 600;
}
.btn-primary:hover { background: var(--accent); opacity: .88; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--wash); color: var(--ink); }

.btn-danger { color: var(--bad-ink); border-color: var(--hairline-2); }
.btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }

.btn-sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: var(--r-pill); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .42; cursor: not-allowed; }

.icon-btn {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-pill);
  border: 1px solid var(--hairline-2);
  background: var(--surface);
  color: var(--ink-2);
  transition: background .16s, color .16s, transform .12s;
}
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.sm { width: 27px; height: 27px; border-radius: 8px; }
.icon-btn.sm svg { width: 14px; height: 14px; }
.icon-btn.bare { border-color: transparent; background: transparent; }

/* Segmented control */
.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--sunken);
  border-radius: var(--r-pill);
  border: 1px solid var(--hairline);
}
.seg button {
  height: 26px; padding: 0 12px;
  border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 550;
  color: var(--ink-2);
  transition: background .18s var(--ease), color .18s var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > .lbl { padding-left: 1px; }

.input, .select, .textarea {
  width: 100%;
  height: 38px;
  padding: 0 11px;
  border-radius: var(--r);
  border: 1px solid var(--hairline-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  transition: border-color .16s, box-shadow .16s;
}
.textarea { height: auto; padding: 9px 11px; min-height: 66px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--ink-2);
  box-shadow: 0 0 0 3px var(--wash-2);
}
.input::placeholder { color: var(--ink-3); }
.input.num-input { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.select {
  appearance: none;
  padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 17px, calc(100% - 11px) 17px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}

.check { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--ink); flex: none; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* --------------------------------------------------------------------------
   Cards & grid
   -------------------------------------------------------------------------- */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.c3 { grid-column: span 3; }  .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; }  .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; }  .c8 { grid-column: span 8; }
.c9 { grid-column: span 9; }  .c12 { grid-column: span 12; }

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  padding: 16px;
  box-shadow: var(--shadow-1);
  min-width: 0;
}
.card-pad-lg { padding: 20px; }
.card-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.card-head h2, .card-head h3 { font-size: 13.5px; letter-spacing: -0.012em; }
.card-head .lbl { margin-right: auto; }
.card-head-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.section-head {
  display: flex; align-items: baseline; gap: 12px;
  margin: 26px 0 12px;
}
.section-head h2 { font-size: 16px; letter-spacing: -0.025em; }
.section-head .lbl { margin-left: auto; }

/* Ledger leader-dot row — the signature detail */
.ledger { display: flex; flex-direction: column; }
.ledger-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 0;
  min-width: 0;
}
.ledger-row + .ledger-row { border-top: 1px solid var(--hairline); }
.ledger-row .k { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ledger-row .leader {
  flex: 1 1 auto; min-width: 14px;
  height: 1px;
  align-self: flex-end; margin-bottom: 4px;
  background-image: radial-gradient(circle, var(--hairline-2) 0.8px, transparent 0.9px);
  background-size: 5px 3px;
  background-position: bottom;
  background-repeat: repeat-x;
  opacity: .9;
}
.ledger-row .v { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Stat tile ---------------------------------------------------------------- */
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat-value {
  font-size: 27px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05;
  font-variant-numeric: proportional-nums;
}
.stat-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.stat-row { display: flex; align-items: flex-end; gap: 10px; }
.stat-row .spark { margin-left: auto; }

.delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.delta svg { width: 11px; height: 11px; }

/* Hero --------------------------------------------------------------------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 24px;
  border-radius: var(--r-card);
  background: var(--surface);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-2);
}
.hero-sheen {
  position: absolute; inset: -40% -10% auto -10%; height: 320px;
  pointer-events: none;
  background: radial-gradient(60% 70% at 22% 0%, var(--sheen, transparent) 0%, transparent 72%);
  opacity: .5;
}
:root[data-theme="dark"] .hero-sheen,
:root:not([data-theme="light"]) .hero-sheen { opacity: .34; }
.hero-inner { position: relative; display: flex; flex-wrap: wrap; gap: 22px 34px; align-items: flex-start; }
.hero-main { min-width: 220px; }
.hero-value {
  font-size: clamp(40px, 7vw, 58px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1;
  margin-top: 8px;
  font-variant-numeric: proportional-nums;
}
.hero-note { margin-top: 10px; font-size: 13px; color: var(--ink-2); max-width: 42ch; }
.hero-side { display: flex; gap: 26px; margin-left: auto; flex-wrap: wrap; }
.hero-mini .lbl { margin-bottom: 5px; }
.hero-mini-v { font-size: 19px; font-weight: 600; letter-spacing: -0.03em; }

/* Chips & pills ------------------------------------------------------------ */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 21px; padding: 0 8px;
  border-radius: var(--r-pill);
  background: var(--wash);
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn-ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad-ink); }
.chip svg { width: 11px; height: 11px; }

.dot { width: 8px; height: 8px; border-radius: 3px; flex: none; background: var(--c, var(--s0)); }
.dot.lg { width: 10px; height: 10px; border-radius: 3.5px; }

/* --------------------------------------------------------------------------
   Charts
   -------------------------------------------------------------------------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart-scroll { overflow-x: auto; overflow-y: hidden; margin: 0 -4px; padding: 0 4px; }
.chart text { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .lbl-strong { fill: var(--ink); font-weight: 500; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend-key { width: 12px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
.legend-key.sq { width: 9px; height: 9px; border-radius: 3px; }

/* Allocation bar — one dollar, divided */
.allocbar { display: flex; gap: 2px; height: 34px; border-radius: 8px; overflow: hidden; background: var(--sunken); }
.allocbar-seg {
  background: var(--c);
  transition: flex-grow .5s var(--ease-out), opacity .16s;
  position: relative;
  min-width: 2px;
}
.allocbar-seg.empty { background: repeating-linear-gradient(135deg, var(--sunken), var(--sunken) 4px, var(--wash) 4px, var(--wash) 8px); }
.allocbar-seg:hover { opacity: .82; }
.allocbar.slim { height: 8px; border-radius: 4px; }

/* Meter (progress bar) */
.meter { height: 6px; border-radius: 3px; background: var(--track, var(--sunken)); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 3px; background: var(--c, var(--ink)); transition: width .6s var(--ease-out); }
.meter.tall { height: 8px; border-radius: 4px; }

/* Ring */
.ring { display: block; }
.ring circle { fill: none; stroke-linecap: round; }
.ring .track { stroke: var(--sunken); }
.ring .val { stroke: var(--c, var(--ink)); transition: stroke-dashoffset .8s var(--ease-out); }
.ring-wrap { position: relative; display: inline-grid; place-items: center; }
.ring-center { position: absolute; text-align: center; line-height: 1.1; }
.ring-center .rv { font-size: 15px; font-weight: 600; letter-spacing: -0.03em; }

/* Sparkline */
.spark { display: block; }
.spark path.line { fill: none; stroke: var(--c, var(--ink-3)); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: var(--c, var(--ink-3)); opacity: .1; stroke: none; }
.spark circle { fill: var(--c, var(--ink)); }

/* Tooltip */
.tip {
  position: fixed; z-index: 200;
  pointer-events: none;
  padding: 8px 10px;
  border-radius: var(--r);
  background: var(--surface);
  border: 1px solid var(--hairline-2);
  box-shadow: var(--shadow-3);
  font-size: 12px;
  min-width: 130px;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .12s, transform .12s;
}
.tip.on { opacity: 1; transform: translateY(0); }

/* --------------------------------------------------------------------------
   Lists / tables
   -------------------------------------------------------------------------- */
.tbl-wrap { overflow-x: auto; }

.tbl th {
  text-align: left; font-family: var(--mono); font-size: 9.5px; font-weight: 500;

/* --------------------------------------------------------------------------
   Insight rows
   -------------------------------------------------------------------------- */
.insight {

}
.insight + .insight { border-top: 1px solid var(--hairline); }

.insight-ico.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad-ink); }

.insight-title { font-size: 13.5px; font-weight: 550; letter-spacing: -0.012em; }
.insight-text { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

/* --------------------------------------------------------------------------
   Modal / sheet
   -------------------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(6, 7, 9, .5);

  opacity: 0;

.modal {
  position: fixed; z-index: 110;
  left: 50%; top: 50%;

.modal-head {

}

  background: var(--ink); color: var(--surface);
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-3);

@keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }
.toast.out { animation: toast-out .22s var(--ease) forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
/* An amount field that grows with its value, so the currency symbol always
   sits right beside the number instead of drifting to the edge. */
.divide-amount {
  display: flex; align-items: baseline; justify-content: center; gap: 4px;
  padding: 6px 0 14px;
  max-width: 100%;
}
.divide-amount .cur { font-size: 23px; font-weight: 500; color: var(--ink-3); flex: none; }
/* The mirror alone sizes the box; the input is taken out of flow so its
   default intrinsic width (about 20 characters) cannot stretch the field. */
.amt-field { position: relative; display: inline-block; min-width: 0; max-width: 100%; }
.amt-field > * {
  font-family: var(--sans);
  font-size: clamp(36px, 10vw, 52px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.1;
  font-variant-numeric: proportional-nums;
  padding: 0 2px;
}
.amt-mirror { display: block; visibility: hidden; white-space: pre; pointer-events: none; min-width: 1ch; }
.amt-field input {
  position: absolute; inset: 0;
  width: 100%; min-width: 0;
  border: 0; background: transparent; outline: none;
  color: var(--ink);
  text-align: left;
}
.amt-field input::placeholder { color: var(--ink-3); }
.amt-field input::-webkit-outer-spin-button,
.amt-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.amt-field input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.amt-field:focus-within { outline: none; }
.amt-field:focus-within + .amt-underline { opacity: 1; }

.divide-status {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  border-radius: var(--r);
  background: var(--sunken);
  border: 1px solid var(--hairline);
  transition: background .3s, border-color .3s;
}
.divide-status.done { background: color-mix(in srgb, var(--good) 13%, transparent); border-color: color-mix(in srgb, var(--good) 34%, transparent); }
.divide-status.over { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 34%, transparent); }
.divide-status .v { margin-left: auto; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }

.split-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 96px 54px 30px;
  align-items: center; gap: 10px;
  padding: 9px 0;
}

  background: var(--surface); padding: 0 9px;

   Mobile
   -------------------------------------------------------------------------- */
.tabbar { display: none; }

@media (max-width: 900px) {

  .hero { padding: 19px; }
  .hero-side { margin-left: 0; gap: 20px; width: 100%; }
  .stat-value { font-size: 22px; }

  .modal-body { padding: 15px; }

  .toasts { bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); }

  .tabbar {
    position: fixed; z-index: 60;
    left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    align-items: center;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));

    backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--hairline);

    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px;

  .tab[aria-current="page"] { color: var(--ink); }
  .tab.add { color: var(--ink); }
  .tab.add .tab-plus {
    width: 38px; height: 38px; border-radius: 13px;
    background: var(--accent); color: var(--ink-on-accent);
    display: grid; place-items: center;
    box-shadow: var(--shadow-2);
    transition: transform .14s var(--ease);
  }
  .tab.add:active .tab-plus { transform: scale(.9); }
  .tab.add .tab-plus svg { width: 20px; height: 20px; }
}

/* Phones: only the four headline stat tiles stay two-up. Everything else
   gets the full width — half a phone screen is not enough for a chart. */
@media (max-width: 660px) {
  .c4, .c5, .c6 { grid-column: span 2; }

  .stat-row .spark { display: none; }
  .stat-foot { flex-wrap: wrap; row-gap: 1px; font-size: 11.5px; }
  .hero-inner { gap: 16px 24px; }
  .hero { padding: 17px; }
  .section-head { margin: 22px 0 10px; }
  .hero-value { font-size: clamp(34px, 11vw, 46px); }
  .hero-side { gap: 16px 22px; }
  .stat-value { font-size: 21px; }
  .topbar h1 { font-size: 18px; }
  .legend { gap: 4px 12px; }
  .legend-item { font-size: 11.5px; }
  .tbl th, .tbl td { padding-left: 7px; padding-right: 7px; }
}

@media (min-width: 901px) { .desktop-hide { display: none !important; } }

/* --------------------------------------------------------------------------
   Motion
   -------------------------------------------------------------------------- */
.stagger > * { animation: rise .5s var(--ease-out) backwards; }
.stagger > *:nth-child(1) { animation-delay: .02s; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .1s; }
.stagger > *:nth-child(4) { animation-delay: .14s; }
.stagger > *:nth-child(5) { animation-delay: .18s; }
.stagger > *:nth-child(6) { animation-delay: .22s; }
.stagger > *:nth-child(7) { animation-delay: .26s; }
.stagger > *:nth-child(8) { animation-delay: .3s; }
.stagger > *:nth-child(n+9) { animation-delay: .34s; }

@keyframes rise { from { opacity: 0; transform: translateY(9px); } }

.view-enter { animation: rise .4s var(--ease-out); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* Print -------------------------------------------------------------------- */
@media print {
  .rail, .tabbar, .topbar-actions, .icon-btn { display: none !important; }
  .card, .hero, .bucket { box-shadow: none; border-color: #ccc; break-inside: avoid; }
}

/* A card whose last block should sit against the bottom edge, so cards in a
   row stay the same height without leaving a hole in the middle. */
.card-fill { display: flex; flex-direction: column; }

/* Action cells in tables keep their controls on one line. */
.row-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; white-space: nowrap; }

function keyboard() {
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { 1: 'home', 2: 'buckets', 3: 'goals', 4: 'transactions', 5: 'invest', 6: 'history', 7: 'settings' };

/**
 * How to divide a given amount. Uses each bucket's own target; if no targets
 * are set at all, falls back to an even split so there is always a starting point.
 */
function suggestSplit(s, amount, monthIncomeSoFar = null) {
  const buckets = spendableBuckets(s);
  const amt = round2(amount || 0);
  const out = {};
  if (amt <= 0 || !buckets.length) { buckets.forEach((b) => { out[b.id] = 0; }); return out; }

  const incomeBasis = monthIncomeSoFar == null ? amt : monthIncomeSoFar;
  const wants = buckets.map((b) => {
    if (b.targetMode === 'fixed') return { b, want: round2(b.targetValue || 0) };
    return { b, want: round2(incomeBasis * ((b.targetValue || 0) / 100)) };
  });

  const totalWant = sum(wants, (w) => w.want);
  if (totalWant <= 0) {
    const each = round2(amt / buckets.length);
    let left = amt;
    buckets.forEach((b, i) => {
      const v = i === buckets.length - 1 ? round2(left) : each;
      out[b.id] = v; left = round2(left - v);
    });
    return out;
  }

  // Scale to fit the money actually available, largest-remainder rounded to cents.
  const scale = Math.min(1, amt / totalWant);
  let left = amt;
  wants.forEach(({ b, want }, i) => {
    const v = i === wants.length - 1 ? round2(Math.max(0, left)) : round2(Math.min(left, want * scale));
    out[b.id] = v;
    left = round2(left - v);
  });
  return out;
}

/** A gentle nudge when targets look unbalanced. */
function allocationAdvice(s) {
  const buckets = spendableBuckets(s);
  const pctBuckets = buckets.filter((b) => b.targetMode === 'percent');
  const totalPct = round2(sum(pctBuckets, (b) => b.targetValue || 0));
  const savePct = round2(sum(pctBuckets.filter((b) => b.kind === 'save'), (b) => b.targetValue || 0));
  const invPct = round2(sum(pctBuckets.filter((b) => b.kind === 'invest'), (b) => b.targetValue || 0));
  const fixedTotal = round2(sum(buckets.filter((b) => b.targetMode === 'fixed'), (b) => b.targetValue || 0));

/**

function forecast(s, monthsAhead = 12, overrides = {}) {

  const now = monthStats(s, thisMonth());
  const avg = (field) => recentAverage(s, field, 3) || now[field];
  const avgIncome = overrides.income ?? avg('income');
  const avgSaved = overrides.saved ?? avg('saved');
  const avgInvested = overrides.invested ?? avg('invested');
  const avgSpent = overrides.spent ?? avg('spent');
  const annual = overrides.annualReturn ?? (s.settings.annualReturn || 0.07);
  const r = Math.pow(1 + annual, 1 / 12) - 1;

  let portfolio = portfolioValue(s);
  const debt = totalDebt(s);

  for (let i = 1; i <= monthsAhead; i++) {
    mk = addMonths(mk, 1);

    portfolio = round2(portfolio * (1 + r) + avgInvested);
    rows.push({
      monthKey: mk, month: i,
      cash, portfolio,
      netWorth: round2(cash + portfolio - debt),
      income: avgIncome, saved: avgSaved, invested: avgInvested, spent: avgSpent,
    });
  }

    rows,
    assumptions: { income: avgIncome, saved: avgSaved, invested: avgInvested, spent: avgSpent, annualReturn: annual },
    at: (n) => rows[Math.min(rows.length, n) - 1],

    .filter((b) => b.kind === 'spend')
    .map((b) => {

        bucketId: UNALLOCATED_ID, accountId, createdAt: new Date().toISOString(),
      });
      buckets.forEach((b) => {
        const v = round2(state.split[b.id] || 0);
        if (v <= 0) return;
        st.transactions.unshift({
          id: uid('t'), date, description: `Allocated to ${b.name}`, amount: v,
          type: 'transfer', bucketId: UNALLOCATED_ID, toBucketId: b.id, accountId,
          createdAt: new Date().toISOString(),
        });
      });
      st.transactions.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    }, 'income');

    const left = round2(amt - total);
    m.close();
    toast(left > 0.004
      ? `${money(amt)} recorded — ${money(left)} still to divide.`
      : `${money(amt)} recorded and fully divided.`);
  });

  paint();
}

function nextFreeSlot(s) {
  const used = new Set(s.buckets.map((b) => b.color));
  return (SLOTS.find((x) => x.id !== 's0' && !used.has(x.id)) || SLOTS[0]).id;
}

async function deleteBucket(b) {
  const s = getState();
  const used = s.transactions.filter((t) => t.bucketId === b.id || t.toBucketId === b.id).length;
  const bal = allBalances(s)[b.id] || 0;
  const ok = await confirmDialog({
    title: `Delete ${b.name}?`,
    text: used
      ? `${used} transaction${used === 1 ? '' : 's'} point at this bucket. They will be moved to Unallocated Money${
        Math.abs(bal) > 0.004 ? `, along with its ${money(bal)} balance` : ''}, so no money is lost.`
      : 'This bucket has no transactions, so nothing else changes.',
    confirmLabel: 'Delete bucket', danger: true,
  });
  if (!ok) return;
  commit((st) => {
    st.transactions.forEach((t) => {
      if (t.bucketId === b.id) t.bucketId = UNALLOCATED_ID;
      if (t.toBucketId === b.id) t.toBucketId = UNALLOCATED_ID;
    });
    st.transactions = st.transactions.filter((t) => !(t.type === 'transfer' && t.bucketId === t.toBucketId));
    st.goals.forEach((g) => { if (g.bucketId === b.id) g.bucketId = null; });
    st.recurring.forEach((r) => { if (r.bucketId === b.id) r.bucketId = UNALLOCATED_ID; });
    st.buckets = st.buckets.filter((x) => x.id !== b.id);
    st.buckets.filter((x) => x.id !== UNALLOCATED_ID).forEach((x, i) => { x.order = i; });
  }, 'delete bucket');
  toast(`${b.name} deleted.`);
}

/** Reorder buckets — used by both drag and the keyboard arrows. */
function reorderBucket(id, delta) {
  commit((st) => {
    const list = st.buckets.filter((b) => b.id !== UNALLOCATED_ID && !b.archived).sort((a, b) => a.order - b.order);
    const i = list.findIndex((b) => b.id === id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    list.forEach((b, k) => { b.order = k; });
    const sys = st.buckets.find((b) => b.id === UNALLOCATED_ID);
    if (sys) sys.order = 9999;
  });
}

function reorderBucketTo(id, targetId) {
  commit((st) => {
    const list = st.buckets.filter((b) => b.id !== UNALLOCATED_ID && !b.archived).sort((a, b) => a.order - b.order);
    const from = list.findIndex((b) => b.id === id);
    const to = list.findIndex((b) => b.id === targetId);
    if (from < 0 || to < 0 || from === to) return;
    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    list.forEach((b, k) => { b.order = k; });
    const sys = st.buckets.find((b) => b.id === UNALLOCATED_ID);
    if (sys) sys.order = 9999;
  });
}
