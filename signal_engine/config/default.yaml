# Default Data Engine configuration (Phase 3). Everything here is overridable.
version: 1

data:
  timezone: America/New_York        # canonical tz for all internal timestamps
  base_timeframe: "1m"              # finest available timeframe of the source
  target_timeframes: ["5m", "15m", "1H"]   # generated via no-lookahead resample
  # How the SOURCE labels each bar's timestamp:
  #   "open"  = timestamp marks the START of the bar (FirstRateData convention)
  #   "close" = timestamp marks the END/close of the bar
  # Internally all bars are normalized to CLOSE-labeled.
  input_timestamp_convention: "open"
  # tz localization policy for naive ET timestamps during DST transitions
  dst_ambiguous: "infer"            # pandas tz_localize ambiguous=
  dst_nonexistent: "shift_forward"  # pandas tz_localize nonexistent=

validation:
  gap_factor: 3.0                   # intra-session gap > gap_factor * base_interval => flagged
  drop_invalid: false               # if true, drop invalid rows instead of only reporting
  raise_on_error: false             # if true, raise on any ERROR-severity issue

sessions:
  # All times are local to data.timezone (ET). See docs/MARKET_DATA.md §7.
  rth:
    start: "09:30"
    end: "16:00"
  eth:
    enabled: true                   # independent toggle for extended hours
    start: "18:00"                  # Globex open (previous evening for a trade date)
    end: "17:00"                    # Globex close
    maintenance_break:
      start: "17:00"
      end: "18:00"
  # Trade-date rolls at this local time (CME clearing convention ~17:00 ET).
  trade_date_rollover: "17:00"

resample:
  # Align higher-timeframe bins to the session open ("session_open") or to the
  # epoch grid ("epoch"). session_open keeps ORB/context aligned to 09:30 / 18:00.
  origin: "session_open"

rollover:
  method: "volume"                  # volume-based front->next roll
  # roll when next-contract daily volume exceeds front by this ratio, within window
  volume_ratio: 1.0
  lookback_days: 15                 # only consider rolling within N trade days of expiry
  continuous_adjustment: "ratio"    # "raw" | "ratio" for the CONTINUOUS series stats

storage:
  root: "data_store"                # parquet root (partitioned by symbol/contract/timeframe)

timeframe_roles:                    # semantic roles (ARCHITECTURE.md §7)
  context: "1H"
  structure: "15m"
  execution: "5m"

analysis:                           # Phase 4 market-analysis backend
  structure_backend: "native"       # "native" | "smc"
  native_n_left: 3
  native_n_right: 3
  smc_swing_length: 8
  with_order_blocks: true

setups:                             # Phase 5 — each setup toggled independently
  liquidity_sweep:
    enabled: true
    timeframe: "5m"
    stop_buffer_ticks: 2.0
    rr_targets: [1.0, 2.0]          # R multiples for TP1/TP2 (not optimized)
    expiration_bars: 6
    use_opposing_liquidity_target: false
  vwap_reclaim:
    enabled: true
    timeframe: "5m"
    lookback_bars: 12
    stop_buffer_ticks: 2.0
    rr_targets: [1.0, 2.0]
    expiration_bars: 6
  orb:
    enabled: true
    timeframe: "5m"
    opening_range_minutes: 30
    session: "RTH"
    rr_targets: [1.0, 2.0]          # multiples of the OR range
    expiration_bars: 12

signals:                             # Phase 6 — SetupCandidate -> Signal | NoTrade
  min_risk_reward: 1.0               # nearest-TP R:R threshold (not optimized)
  deduplication_enabled: true
  validate_entry_against_context: true

live:                                  # Phase 10 — Live Market Data
  stale_after_seconds: 300.0           # no fresh bar within this window -> STALE
                                       # (hard NO_TRADE guard; 90s falsely killed
                                       #  delayed 1m feeds that batch irregularly)
  reconnect_max_attempts: 3
  reconnect_backoff_seconds: 2.0
  buffer_max_days: 10

risk:                                 # Phase 7 — Signal -> Risk Validation -> Position Size
  risk_mode: "percent"                # "fixed" | "percent"
  fixed_risk_dollar: 500.0            # used when risk_mode == "fixed" (not optimized)
  risk_pct: 0.01                      # 1% of account equity (percent mode, not optimized)
  max_risk_per_trade_dollar: null     # optional extra hard ceiling on top of the mode above
  daily_loss_limit_dollar: 1000.0
  max_trades_per_day: 5
  max_contracts: 10

output:                             # Phase 5.5 — external observability adapters
  discord:
    enabled: true                   # enabled for live notifications
    webhook_env: "DISCORD_WEBHOOK_URL"   # env var NAME (never the value)
    timeout_seconds: 5.0
    retry_count: 2
    deduplication_enabled: true

ghost:                              # Phase 14 — GHOST intelligence layer
  enabled: true
  # Lowered from the Python default (55) so trades can be approved even when
  # EMA-50 hasn't fully warmed up and HTF bias is NEUTRAL (0 pts from the
  # 20-pt htf_alignment factor). A score of 40 requires at least structure +
  # VWAP + volume + R:R confluence, which is a meaningful bar to clear.
  # Calibrated against the sample, measuring edge as well as throughput:
  #   35 -> 55 trades, exp_R 0.243, PF 1.64, net 9.0R, maxDD 3.0R  <- best
  #   40 -> 41 trades, exp_R 0.259, PF 1.70, net 7.0R, maxDD 5.0R
  #   55 -> 16 trades, exp_R 0.143, PF 1.33, net 2.0R, maxDD 4.0R
  # 35 wins on total return AND drawdown; above ~50 the edge itself collapses.
  # Note ~16 of these points are a constant offset (volume_confirmation and
  # rr_quality fire on every signal), so the real discriminating bar is ~19.
  min_confluence_score: 35.0
  # These two hard-blocks are converted to soft penalties only: they still
  # subtract -25 / -20 pts from the confluence score, but they no longer
  # reject the trade outright before scoring runs. A conflicting setup will
  # score too low to pass; a marginal one without conflicts can still pass.
  block_htf_conflict: false
  block_against_structure: false
  # All other parameters use Python defaults (see config/schema.py).
  paper_enabled: true
