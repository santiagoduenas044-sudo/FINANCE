# Variants that run IN PARALLEL with each bot ("set ups"): same live market,
# their own paper trades, and their own Discord alerts when they enter and
# exit (BOT_AVISOS_SETUPS=off silences them). They exist to compare, day by day, how
# another version of a strategy would have done next to the one the bot
# really trades. Their results show in the dashboard (Bots tab).
#
# Each one can be switched on and off from the dashboard (Bots tab), without
# restarting anything; `enabled` is only the default before the first switch.
# To add one, copy a block and change it (then update the bot). Its record
# stays in data_store/shadows/ even while it is off.
#
# setup: the set up's number ("Set up 3"), shown everywhere instead of a long
#        name. 1 is GHOST and 2 is ORBIT (the bots themselves); never reuse one.
# name:  the strategy's short code (versions.py STRATEGIES).
# ghost: strategy = a file in config/strategies/ ("legacy" = default.yaml),
#        overrides = changes on top, version = the GHOST version it replays.
# orbit: settings = changes to APERTURA's rules (opening_range.OrbSettings).

ghost:
  - id: setups_clasicos
    setup: 8
    name: "CLÁSICO"
    about: "La primera versión (v1): ruptura de apertura, barrida de liquidez y VWAP en velas de 5 min."
    strategy: legacy
    version: v1
    enabled: false

  - id: zonas_1m
    setup: 3
    name: "IMÁN 1"
    about: "La versión de 1 min tal cual corría (v2): zonas de 5 min, entrada con vela de 1 min, BE+2 al 70 %, 9:30–15:30."
    strategy: zones_1m
    version: v2

  - id: zonas_1m_noche
    setup: 4
    name: "IMÁN 1 NOCHE"
    about: "La misma versión de 1 min, también de noche (como v3)."
    strategy: zones_1m
    version: v3
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"

  - id: zonas_15m_fijo
    setup: 9
    name: "IMÁN 15 FIJO"
    about: "Set up 1 como estaba hasta el 6 de octubre: stop fijo de 20–35 pts y objetivo 3×, sin importar el tamaño de las velas. Para comparar con el stop según el mercado."
    strategy: zones_fijo
    version: v4

  - id: zonas_15m_noticias
    setup: 5
    name: "IMÁN 15 CALMA"
    about: "La versión principal, pero sin entrar de 10 min antes a 15 min después de una noticia fuerte de EE.UU. (CPI, empleo, FOMC…)."
    strategy: zones
    overrides:
      ghost:
        news_blackout: {before: 10, after: 15, impacts: ["High"]}

  - id: zonas_15m_tendencia
    setup: 10
    name: "IMÁN 15 TENDENCIA"
    about: "Set up 1, pero solo a favor de la tendencia del día: compra solo con el precio arriba del VWAP y vende solo abajo."
    strategy: zones
    overrides:
      ghost:
        trend_filter: vwap

  - id: zonas_1m_noche_tendencia
    setup: 11
    name: "IMÁN 1 NOCHE TENDENCIA"
    about: "Set up 4, pero solo a favor de la tendencia: compra solo con el precio arriba del VWAP y vende solo abajo."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        trend_filter: vwap

  - id: zonas_1m_noche_noticias
    setup: 12
    name: "IMÁN 1 NOCHE CALMA"
    about: "Set up 4, pero sin entrar de 10 min antes a 15 min después de una noticia fuerte de EE.UU. (CPI, empleo, FOMC…)."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        news_blackout: {before: 10, after: 15, impacts: ["High"]}

orbit:
  - id: apertura_30m
    setup: 6
    name: "APERTURA 30"
    about: "La caja de 9:30 a 10:00 en vez de 9:45; todo lo demás igual."
    settings:
      range_minutes: 30

  - id: apertura_tp2
    setup: 7
    name: "APERTURA 2×"
    about: "La misma caja de 15 min con el objetivo a 2× el stop en vez de 1.5×."
    settings:
      target_mult: 2.0
