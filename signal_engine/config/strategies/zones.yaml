# Zone-retrace strategy (the live bot's default; BOT_STRATEGY=zones).
# Overlay on default.yaml: only what this strategy changes is listed here.
#
# Model: mark a fresh fair-value-gap zone on 15m, warn when price is coming
# back to it ("get ready"), and only trade the FIRST retrace if a 15m candle
# reacts there (closes back past the zone's middle). Stop behind the origin of
# the move, 20-35 pts from the entry; one target at 3x that distance. Until
# 2026-09 this was 5m zones + 1m confirmation, which lost in the 5-year lab
# test (scripts/strategy_lab.py --estudio zonas).

timeframe_roles:
  context: "1H"
  structure: "15m"                  # the zones and their confirmation live here
  execution: "1m"                   # the bot still checks every minute (stop/target)

analysis:
  max_bars: 1440                    # 24h of 1m: a whole trade date (VWAP), fast

setups:
  liquidity_sweep: {enabled: false}
  vwap_reclaim: {enabled: false}
  orb: {enabled: false}
  zone_retrace:
    enabled: true
    # 15-minute zones, confirmed on 15-minute candles (was 5m zones + 1m
    # confirmation). Lab, 5 years of NQ, 5 MNQ: the 1-minute version lost
    # $91,774 (-$12/trade in 2024-26); this one earned +$25/trade in 2021-23
    # and +$12 in 2024-26. Positive in both periods but NOT a confirmed edge
    # (confidence 1.3 / 0.7): a paper experiment while the lab looks for more.
    # Same rules as the lab row "Zonas 15 min · stop 20-35 pts · TP 3x".
    timeframe: "15m"
    zone_timeframe: "15m"
    zone_lookback_bars: 12          # zones from the last 3 hours
    min_zone_points: 3.0
    max_zone_points: 60.0
    min_stop_points: 20.0
    max_stop_points: 35.0
    stop_buffer_points: 1.0
    stop_from: "fill"               # stop 20-35 pts from the entry, behind the origin
    max_risk_points: 120.0
    arm_distance_points: 30.0
    confirm_bars: 2                 # the reaction within 2 candles (30 min) of the touch
    tp1_r: 1.0
    tp1_max_r: 2.0
    min_target_r: 2.0
    max_target_r: 5.0
    fallback_target_r: 3.0
    fixed_target_r: 3.0             # one target at 3x the stop, whole position
    single_target: true
    expiration_bars: 2

signals:
  # R:R is judged on the plan (midpoint entry); from a fill taken a few points
  # past the midpoint, TP1 at 1R is ~0.5-0.8R — TradingMind's own direct short
  # was 0.55R from "price now". Only reject plans worse than that.
  min_risk_reward: 0.5

ghost:
  min_rr: 0.5
  partial_at_tp1: 0.0               # no partial: one target, whole position
  breakeven_after_tp1: false
  # No breakeven: in the lab the BE+2 at 70% saved some trades and cost
  # others, and on the 15-minute zones it took ~$2/trade away (+$10 vs +$12).
  be_at_progress: null
  be_offset_points: 2.0
  # Flat by 16:55 ET, not 16:00: NQ trades until 17:00 and Apex only needs
  # the account flat before 16:59.
  eod_close_time: "16:55"
  # Day session only (09:30-15:30 entries). The 5-year lab run with the night
  # included lost ~$167,000 on 5 MNQ: overnight stops of 15-18 pts are inside
  # the noise, and almost every night hour lost money.
  valid_sessions: ["RTH"]
  last_entry_time: "15:30"
  # The operator always trades 5 micros: every $ figure is for 5 MNQ ($10/pt).
  contracts: 5
  trade_micro: true
  # The zone rules ARE the filter: no confluence gate, no ATR stop band (a
  # fixed 20-pt stop is ~2 ATR on 1m, which the 5m-era band would reject).
  # Entry cut-off / 16:55 flat / one position / cooldown still apply.
  min_confluence_score: null
  min_stop_atr_mult: 0.0
  max_stop_atr_mult: 0.0
  cooldown_bars: 15                 # 15 minutes after a stop-out
  # No limit on the number of trades; the day still stops once it is down
  # $500 on the 5-MNQ position. Change the numbers here (null = off).
  max_trades_per_day: null
  daily_loss_limit_usd: 500

output:
  notifications:
    trade_progress: false           # no R-milestone spam; TP1 + close only
    trade_ideas: true
    tp1_hit: true
