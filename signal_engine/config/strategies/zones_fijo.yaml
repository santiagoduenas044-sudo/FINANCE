# GHOST v4 / Set up 9: the zones strategy with FIXED point distances (stop
# 20-35 pts and the 3x target the same in any market). The live bot moved to
# distances that follow the candles on 2026-10-06 (zones.yaml, point_mode atr);
# this keeps the fixed one to compare, live and in the backtests.
extends: zones

setups:
  zone_retrace:
    point_mode: points

ghost:
  # the v4 rules: none of the later filters
  clear_path: null
  max_chase_r: null
  max_stop_points: {NQ: 0, MNQ: 0}     # 0 = no cap
  chop_min_er: null
