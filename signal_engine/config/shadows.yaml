# Variants that run IN PARALLEL with each bot ("set ups"): same live market,
# their own paper trades, and their own Discord alerts when they enter and
# exit (BOT_AVISOS_SETUPS=off silences them). They exist to compare, day by day, how
# another version of a strategy would have done next to the one the bot
# really trades. Their results show in the dashboard (Bots tab).
#
# Each one can be switched on and off from the dashboard (Bots tab), without
# restarting anything; `enabled` is only the default before the first switch.
# To add one, copy a block and change it (then update the bot). Its record
# stays in data_store/shadows/ even while it is off.
#
# setup: the set up's number ("Set up 3"), shown everywhere instead of a long
#        name. 1 is GHOST and 2 is ORBIT (the bots themselves); never reuse one.
# name:  the strategy's short code (versions.py STRATEGIES).
# ghost: strategy = a file in config/strategies/ ("legacy" = default.yaml),
#        overrides = changes on top, version = the GHOST version it replays.
# orbit: settings = changes to APERTURA's rules (opening_range.OrbSettings).

# retired: true = the set up never runs again (no switch turns it back on);
#        its record stays and shows in the dashboard and the PDF.
#
# 11-oct-2026 clean-up: only 1, 4 and 13 kept running. 19-oct-2026: the
# operator turned them ALL back on to compare (one of them had been in
# profit), and added the 1-hour versions (14, 15) and copies with
# filters (16, 17, 18). Versions already running are never changed.

# the bots' own strategies that are retired (e.g. [orbit] = APERTURA, Set up 2)
retired: []

# every dashboard switch goes back to the defaults below once per new date
switches_reset: "2026-10-19"

ghost:
  - id: setups_clasicos
    setup: 8
    name: "CLÁSICO"
    about: "La primera versión (v1): ruptura de apertura, barrida de liquidez y VWAP en velas de 5 min."
    strategy: legacy
    version: v1

  - id: zonas_1m
    setup: 3
    name: "FVG 1 DÍA"
    about: "FVG 1 solo de día (9:30–15:30)."
    strategy: zones_1m
    version: v2

  - id: zonas_1m_noche
    setup: 4
    name: "FVG 1"
    about: "Huecos (FVG) de 5 min con entrada en velas de 1 min, de día y de noche. Stop 20–35 pts, objetivo hasta 3×, BE+2 al 70 %. No entra si hay un soporte o resistencia en la primera mitad del camino."
    strategy: zones_1m
    version: v3
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        clear_path: 0.5            # espacio libre (12-oct)

  - id: zonas_1m_europa
    setup: 13
    name: "FVG 1 EUROPA"
    about: "FVG 1 que solo entra de 3:00 a 9:30 (hora de NY), el horario donde el Set up 4 ganaba. A la mitad del camino cierra 2 de 5 MNQ y sube el stop a entrada +2. No entra si hay un soporte o resistencia en la primera mitad del camino."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        entry_hours: ["03:00", "09:30"]
        # lock in gains: halfway close 2 of 5 MNQ, the rest with stop at entry + 2
        partial_at_tp1: 0.4
        partial_at_progress: 0.5
        breakeven_after_tp1: true
        clear_path: 0.5            # espacio libre (12-oct)

  - id: zonas_1h
    setup: 14
    name: "FVG 1H"
    about: "La estrategia del Set up 1 en velas de 1 hora, de día y de noche. Stop y objetivo según el tamaño de las velas de 1 hora (más grandes), objetivo 3×, asegura a la mitad. Con espacio libre (no entra con un soporte o resistencia en la primera mitad del camino)."
    strategy: zones_1h
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"

  - id: zonas_1h_dia
    setup: 15
    name: "FVG 1H DÍA"
    about: "FVG 1H solo de día: entradas de 9:30 a 15:30, todo cerrado a las 16:55."
    strategy: zones_1h

  # 19-oct: the same set ups with three more filters, as NEW set ups (the
  # versions already running are never changed: they keep collecting samples)
  - id: zonas_15m_filtros
    setup: 16
    name: "FVG 15 FILTROS"
    about: "El Set up 1 tal cual, más tres filtros: no entra tarde (precio ya a más de ¾ del stop pasado la mitad de la zona), stop máximo 50 pts ($500) y no entra si las últimas 2 horas fueron serrucho."
    strategy: zones
    overrides:
      ghost:
        max_chase_r: 0.75
        max_stop_points: {NQ: 50.0, MNQ: 50.0}
        chop_min_er: 0.1

  - id: zonas_1m_noche_filtros
    setup: 17
    name: "FVG 1 FILTROS"
    about: "El Set up 4 tal cual, más dos filtros: no entra tarde y no entra si las últimas 2 horas fueron serrucho."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        clear_path: 0.5
        max_chase_r: 0.75
        chop_min_er: 0.1

  - id: zonas_1m_europa_filtros
    setup: 18
    name: "FVG 1 EUROPA FILTROS"
    about: "El Set up 13 tal cual, más dos filtros: no entra tarde y no entra si las últimas 2 horas fueron serrucho."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        entry_hours: ["03:00", "09:30"]
        partial_at_tp1: 0.4
        partial_at_progress: 0.5
        breakeven_after_tp1: true
        clear_path: 0.5
        max_chase_r: 0.75
        chop_min_er: 0.1

  # 21-oct: three more copies of Set up 1, one change each
  - id: zonas_15m_nivel
    setup: 19
    name: "FVG 15 NIVEL"
    about: "El Set up 1 tal cual, pero el objetivo va 2 pts antes del siguiente soporte o resistencia (entre 1.5 y 4 veces el stop), donde el precio suele frenar. Sin nivel en ese tramo, objetivo 3× como siempre."
    strategy: zones
    overrides:
      ghost:
        level_target: true

  - id: zonas_15m_tiempo
    setup: 20
    name: "FVG 15 TIEMPO"
    about: "El Set up 1 tal cual, pero si en 90 min el trade no avanzó ni un tercio del camino al objetivo, lo cierra al precio del momento."
    strategy: zones
    overrides:
      ghost:
        time_exit_minutes: 90
        time_exit_progress: 0.33

  - id: zonas_15m_plan
    setup: 21
    name: "FVG 15 PLAN"
    about: "El Set up 1 tal cual, pero solo opera hacia donde dice el plan de las 9:00 (LONG o SHORT). Si el plan sale neutral, opera para los dos lados."
    strategy: zones
    overrides:
      ghost:
        follow_plan: true

  - id: zonas_15m_fijo
    setup: 9
    name: "FVG 15 FIJO"
    about: "Set up 1 con el stop fijo de 20–35 pts de antes del 6 de octubre."
    strategy: zones_fijo
    version: v4
    overrides:
      ghost:
        # as it ran before 11-oct: no later change of Set up 1 reaches it
        partial_at_tp1: 0.0
        partial_at_progress: null
        breakeven_after_tp1: false
        clear_path: null

  - id: zonas_15m_noticias
    setup: 5
    name: "FVG 15 CALMA"
    about: "Set up 1 sin entrar cerca de noticias fuertes."
    strategy: zones
    overrides:
      ghost:
        news_blackout: {before: 10, after: 15, impacts: ["High"]}
        # as it ran before 11-oct: no later change of Set up 1 reaches it
        partial_at_tp1: 0.0
        partial_at_progress: null
        breakeven_after_tp1: false
        clear_path: null

  - id: zonas_15m_tendencia
    setup: 10
    name: "FVG 15 VWAP"
    about: "Set up 1 solo a favor del VWAP."
    strategy: zones
    overrides:
      ghost:
        trend_filter: vwap
        # as it ran before 11-oct: no later change of Set up 1 reaches it
        partial_at_tp1: 0.0
        partial_at_progress: null
        breakeven_after_tp1: false
        clear_path: null

  - id: zonas_1m_noche_tendencia
    setup: 11
    name: "FVG 1 VWAP"
    about: "Set up 4 solo a favor del VWAP."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        trend_filter: vwap

  - id: zonas_1m_noche_noticias
    setup: 12
    name: "FVG 1 CALMA"
    about: "Set up 4 sin entrar cerca de noticias fuertes."
    strategy: zones_1m
    overrides:
      ghost:
        valid_sessions: ["RTH", "ETH"]
        last_entry_time: "16:15"
        news_blackout: {before: 10, after: 15, impacts: ["High"]}

orbit:
  - id: apertura_30m
    setup: 6
    name: "APERTURA 30"
    about: "La caja de 9:30 a 10:00 en vez de 9:45."
    settings:
      range_minutes: 30

  - id: apertura_tp2
    setup: 7
    name: "APERTURA 2×"
    about: "La misma caja con el objetivo a 2× el stop."
    settings:
      target_mult: 2.0
