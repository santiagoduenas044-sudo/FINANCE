# GHOST in the cloud: the dashboard + GHOST, ORBIT, and Caddy for HTTPS.
# Everything is set up by deploy/cloud/server_setup.sh; by hand:
#   1. this repository in /opt/ghost, with its .env, data_store/ and market_data/
#   2. DOMAIN=... in .env (a domain of yours, or <ip-with-dashes>.sslip.io)
#   3. docker compose up -d --build
# Paper trading only: no broker, no order execution.
services:
  ghost:
    build: .
    image: ghost-bot:latest
    restart: unless-stopped            # also brings it back after an in-app update
    env_file: .env
    environment:
      BOT_MODE: remote
      BOT_HOST: 0.0.0.0
      BOT_PORT: "8000"
      BOT_AUTO_START: "true"
      BOT_IN_DOCKER: "1"
    volumes:
      - .:/app                          # code + data_store/ + market_data/ (kept on the server)
      - /opt/ghost-secrets:/run/ghost:ro
    expose: ["8000"]

  orbit:
    image: ghost-bot:latest
    depends_on: [ghost]
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_IN_DOCKER: "1"
    command: ["python", "-m", "signal_engine.subbots.orbit"]
    healthcheck:
      disable: true                     # ORBIT has no web page; Docker restarts it if it stops
    volumes:
      - .:/app
      - /opt/ghost-secrets:/run/ghost:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [ghost]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
