# Centralized, versioned contract specifications.
# IMPORTANT: values are PROVISIONAL and NOT verified against CME Group yet.
# See docs/CME_VERIFICATION.md. Never hardcode these in strategy/risk logic.
version: 1
verified: false                 # flip to true only after official CME verification
verification:
  source: null                  # e.g. "cmegroup.com contract specs"
  date: null                    # e.g. "2026-09-14"
  note: >-
    cmegroup.com remains blocked by the network egress proxy as of the Phase
    6.5 re-check (2026-09-14). No field below has been confirmed against the
    official CME Group source. See docs/CME_VERIFICATION.md for the full
    attempt log and exactly which fields are still unverified per instrument.
  unverified_fields:
    - "ES.multiplier / ES.tick_size / ES.tick_value"
    - "NQ.multiplier / NQ.tick_size / NQ.tick_value"
    - "MES.multiplier / MES.tick_size / MES.tick_value"
    - "MNQ.multiplier / MNQ.tick_size / MNQ.tick_value"
    - "months (contract cycle) for all four symbols"
    - "trading hours (RTH/ETH/maintenance break) shared across all four symbols, see config/default.yaml:sessions"
  attempts:
    - phase: "Phase 3"
      date: "2026-09-14"
      method: "WebFetch to cmegroup.com contract-specs pages (ES, NQ, MES, MNQ)"
      result: "EGRESS_BLOCKED for the whole cmegroup.com domain"
    - phase: "Phase 6.5"
      date: "2026-09-14"
      method: "WebFetch retried on cmegroup.com; WebFetch to web.archive.org as a fallback mirror; WebSearch as a secondary check"
      result: >-
        cmegroup.com: still EGRESS_BLOCKED. web.archive.org: unsupported host
        for WebFetch in this environment (not a network allow/deny signal,
        just an unsupported target). WebSearch: returned an aggregated,
        paraphrased answer attributed to CME Group, but this is a
        search-engine synthesis, NOT a direct read of the primary source, so
        it was deliberately NOT used to set verified: true.

# Point values confirmed by the operator (2026-09-24: NQ = $20 per point) and
# consistent with TradingMind's "~35 pts ≈ $70 per micro" (MNQ = $2 per point).
# Used ONLY to show dollar figures in Discord; sizing still needs verified: true.
operator_confirmed: [NQ, MNQ]

# Month codes for quarterly index futures cycle.
month_codes:
  H: 3    # March
  M: 6    # June
  U: 9    # September
  Z: 12   # December

contracts:
  ES:
    name: "E-mini S&P 500"
    multiplier: 50.0            # $ per index point   (PROVISIONAL)
    tick_size: 0.25            # index points         (PROVISIONAL)
    tick_value: 12.50          # $ per tick           (PROVISIONAL)
    months: [H, M, U, Z]
    exchange: CME
    currency: USD
    is_micro: false
    micro_of: null
  NQ:
    name: "E-mini Nasdaq-100"
    multiplier: 20.0           # PROVISIONAL
    tick_size: 0.25            # PROVISIONAL
    tick_value: 5.00           # PROVISIONAL
    months: [H, M, U, Z]
    exchange: CME
    currency: USD
    is_micro: false
    micro_of: null
  MES:
    name: "Micro E-mini S&P 500"
    multiplier: 5.0            # PROVISIONAL
    tick_size: 0.25            # PROVISIONAL
    tick_value: 1.25           # PROVISIONAL
    months: [H, M, U, Z]
    exchange: CME
    currency: USD
    is_micro: true
    micro_of: ES
  MNQ:
    name: "Micro E-mini Nasdaq-100"
    multiplier: 2.0            # PROVISIONAL
    tick_size: 0.25            # PROVISIONAL
    tick_value: 0.50          # PROVISIONAL
