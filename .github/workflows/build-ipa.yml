name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'ios/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'build.js'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Bundle web app into ios/Resources/www
        run: |
          mkdir -p ios/Resources/www/assets/js/views
          # Copy web app sources into the www bundle folder that Xcode will pack
          cp index.html manifest.webmanifest sw.js ios/Resources/www/
          cp -r assets ios/Resources/www/

      - name: Build archive (no signing)
        run: |
          xcodebuild archive \
            -project ios/Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Ledger.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || cat /tmp/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/Ledger.xcarchive/Products" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Ledger-unsigned.ipa Payload/
          echo "IPA size: $(du -sh Ledger-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-unsigned-ipa
          path: ${{ runner.temp }}/Ledger-unsigned.ipa
          retention-days: 30
