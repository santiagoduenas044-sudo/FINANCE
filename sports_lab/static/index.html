<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Lab</title>
<style>
  /* Fonts are served locally (SIL Open Font License) so the page works offline */
  @font-face { font-family: "Big Shoulders Display"; font-weight: 800 900; font-display: swap;
    src: url(/fonts/big-shoulders-display.woff2) format("woff2"); }
  @font-face { font-family: Barlow; font-weight: 400; font-display: swap; src: url(/fonts/barlow-400.woff2) format("woff2"); }
  @font-face { font-family: Barlow; font-weight: 600; font-display: swap; src: url(/fonts/barlow-600.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fonts/plex-mono-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(/fonts/plex-mono-600.woff2) format("woff2"); }

  /* Newspaper sports-section look: newsprint + ink by day, stadium night by dark mode */
  :root {
    --bg: #f3eee3; --field: #e8e1d0; --ink: #1a1712; --muted: #6b6356; --hair: #cdc4b0;
    --accent: #c8361d; --good: #1d6b3f; --bad: #b3261e; --warn-bg: #efe0b4; --warn-ink: #6e4a00;
    --gA: #1d6b3f; --gB: #5d7f24; --gC: #c89a1c; --gD: #d4722a; --gF: #b3261e; --on-grade: #f3eee3;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: Barlow, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f0d; --field: #1c1b18; --ink: #ece6d8; --muted: #9a9384; --hair: #34312b;
      --accent: #ff6a3d; --good: #5cbf7f; --bad: #ff6f61; --warn-bg: #2e2612; --warn-ink: #f0c65a;
      --gA: #3f9e63; --gB: #86a83a; --gC: #d9ad2b; --gD: #e0823a; --gF: #d8463a; --on-grade: #0f0f0d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f0d; --field: #1c1b18; --ink: #ece6d8; --muted: #9a9384; --hair: #34312b;
    --accent: #ff6a3d; --good: #5cbf7f; --bad: #ff6f61; --warn-bg: #2e2612; --warn-ink: #f0c65a;
    --gA: #3f9e63; --gB: #86a83a; --gC: #d9ad2b; --gD: #e0823a; --gF: #d8463a; --on-grade: #0f0f0d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .mast { max-width: 980px; margin: 0 auto; padding: 14px 16px 0; display: flex; align-items: flex-end;
    justify-content: space-between; gap: 12px; border-bottom: 4px double var(--ink); padding-bottom: 8px; }
  .mast h1 { font: 900 38px/0.9 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .01em; }
  .mast h1 span { color: var(--accent); }
  .mast .dateline { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; text-align: right; }
  .theme { background: none; border: 1px solid var(--ink); color: var(--ink); font: 600 11px var(--mono);
    text-transform: uppercase; padding: 3px 6px; cursor: pointer; margin-top: 4px; }
  nav { max-width: 980px; margin: 0 auto; display: flex; gap: 18px; overflow-x: auto; padding: 0 16px;
    scrollbar-width: none; border-bottom: 1px solid var(--ink); }
  nav button { background: none; border: 0; color: var(--muted); font: 800 18px var(--display);
    text-transform: uppercase; letter-spacing: .05em; padding: 9px 0 7px; cursor: pointer;
    border-bottom: 4px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--ink); border-color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  section { display: none; } section.on { display: block; }
  .card { border-top: 2px solid var(--ink); padding: 12px 0 4px; margin-bottom: 22px; }
  .card > b:first-child, .card h2 { font: 800 20px var(--display); text-transform: uppercase; letter-spacing: .03em; }
  textarea, input, select { width: 100%; background: var(--field); color: var(--ink); border: 1px solid var(--hair);
    border-bottom: 2px solid var(--ink); border-radius: 0; padding: 10px 12px; font: 16px var(--body); }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  textarea { min-height: 70px; font: 15px/1.5 var(--mono); resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .row > * { flex: 1 1 120px; }
  button.btn { background: var(--accent); color: #fff; border: 0; border-radius: 0; padding: 10px 20px;
    font: 800 18px var(--display); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; flex: 0 0 auto; }
  button.btn.ghost { background: var(--ink); color: var(--bg); }
  button.btn:disabled { opacity: .5; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { border: 1px solid var(--ink); color: var(--ink); padding: 4px 9px; font: 600 13px var(--body);
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
  .chip:hover { background: var(--ink); color: var(--bg); }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  code { font-family: var(--mono); font-size: .92em; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-left: 1px solid var(--hair); margin-top: 10px; }
  .kpi { border: 1px solid var(--hair); border-left: 0; margin-top: -1px; padding: 10px 12px; }
  .kpi .lbl { font: 800 15px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kpi .rec { font: 600 22px/1.2 var(--mono); margin: 2px 0; letter-spacing: -.02em; }
  .kpi .rec .small { font-size: 14px; color: var(--muted); }
  .kpi .sub { font: 400 12px var(--mono); color: var(--muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font: 800 14px var(--display); text-transform: uppercase; letter-spacing: .06em;
    padding: 6px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
  td { padding: 7px 6px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.num { font: 14px var(--mono); }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); column-gap: 24px; }
  .scroll { overflow-x: auto; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-left: 4px solid var(--warn-ink);
    padding: 8px 10px; margin: 10px 0; font-size: 14px; }
  .err { color: var(--bad); border-left: 4px solid var(--bad); padding: 8px 10px; }
  .bar { height: 10px; background: var(--hair); min-width: 60px; }
  .bar i { display: block; height: 100%; }
  .game { border-top: 3px solid var(--ink); padding: 10px 0 6px; margin-bottom: 22px; }
  .game h3 { margin: 0; font: 900 30px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .game .meta { font: 400 12px var(--mono); color: var(--muted); text-transform: uppercase; margin: 4px 0 8px; }
  .gl { display: grid; grid-template-columns: 1fr 70px 96px 46px; gap: 8px; align-items: center; padding: 6px 0;
    border-top: 1px solid var(--hair); }
  .gl > div:first-child { font-weight: 600; }
  .gl .odds { background: var(--field); text-align: center; padding: 4px; font: 600 14px/1.2 var(--mono); }
  .gl .odds small { color: var(--muted); display: block; font: 400 12px var(--mono); }
  .gl .pro { text-align: right; font: 600 15px var(--mono); }
  .grade { text-align: center; font: 900 20px/1 var(--display); padding: 9px 0; color: var(--on-grade); }
  .gA { background: var(--gA); } .gB { background: var(--gB); } .gC { background: var(--gC); }
  .gD { background: var(--gD); } .gF { background: var(--gF); }
  .gl.head div { font: 800 13px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .blurb { font-size: 15px; margin: 4px 0 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .fields { columns: 2 260px; font-size: 13px; margin-top: 6px; }
  .fields div { break-inside: avoid; padding: 2px 0; }
  .fields code { color: var(--accent); cursor: pointer; font-weight: 600; }
  .spinner { color: var(--muted); padding: 20px 0; text-align: center; font: 400 13px var(--mono); text-transform: uppercase; }
  @media (max-width: 520px) {
    .gl { grid-template-columns: 1fr 58px 84px 40px; } .mast h1 { font-size: 32px; }
    .game h3 { font-size: 26px; }
  }
</style>
</head>
<body>
<header>
  <div class="mast">
    <h1>Sports Lab<span>.</span></h1>
    <div class="dateline"><div>Almanaque NFL</div><div id="dbinfo"></div>
      <button class="theme" id="theme" title="Cambiar tema">Auto</button></div>
  </div>
  <nav id="tabs">
    <button data-t="trends" class="on">Tendencias</button>
    <button data-t="pro">Proyecciones</button>
    <button data-t="ratings">Ratings</button>
    <button data-t="splits">Splits</button>
    <button data-t="model">Modelo</button>
  </nav>
</header>
<main>
  <!-- TENDENCIAS -->
  <section id="trends" class="on">
    <div class="card">
      <textarea id="q" spellcheck="false">total_line < 40 and wind >= 12 and outdoors</textarea>
      <div class="row" style="margin-top:8px">
        <input id="desde" type="number" placeholder="Desde temporada">
        <input id="hasta" type="number" placeholder="Hasta temporada">
        <input id="testdesde" type="number" placeholder="Prueba desde (auto)">
        <button class="btn" id="run">Buscar</button>
      </div>
      <div class="chips" id="examples"></div>
      <details style="margin-top:10px"><summary>Campos disponibles (toca uno para agregarlo)</summary>
        <div class="fields" id="fields"></div></details>
    </div>
    <div id="result"></div>
  </section>

  <!-- PROYECCIONES -->
  <section id="pro">
    <div class="card row">
      <input id="pseason" type="number" placeholder="Temporada (auto)">
      <input id="pweek" type="number" placeholder="Semana (auto)">
      <button class="btn" id="prun">Ver</button>
    </div>
    <div id="presult"></div>
  </section>

  <!-- RATINGS -->
  <section id="ratings"><div id="rresult" class="card"></div></section>

  <!-- SPLITS -->
  <section id="splits">
    <div class="card">
      <div class="small muted" style="margin-bottom:8px">Guarda los % que ves en Action / DK / VSiN. Con el tiempo
        tienes tu propio historial para consultas como <code>money_pct >= 60 and bets_pct <= 40</code>.</div>
      <select id="sgame"></select>
      <div class="row" style="margin-top:8px">
        <input id="hb" type="number" placeholder="% tickets local">
        <input id="hm" type="number" placeholder="% dinero local">
        <input id="ob" type="number" placeholder="% tickets over">
        <input id="om" type="number" placeholder="% dinero over">
      </div>
      <div class="row" style="margin-top:8px">
        <input id="ssrc" placeholder="Fuente (Action, DK...)" value="Action">
        <button class="btn" id="sadd">Guardar</button>
      </div>
      <div id="smsg" class="small" style="margin-top:8px"></div>
    </div>
    <div class="card"><div id="slist"></div></div>
  </section>

  <!-- MODELO -->
  <section id="model">
    <div class="card row">
      <button class="btn" id="bupd">Actualizar datos + clima</button>
      <button class="btn ghost" id="btrain">Re-entrenar modelo</button>
      <div id="bmsg" class="small muted" style="flex-basis:100%"></div>
    </div>
    <div id="bresult"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const sgn = (x, d = 1) => x == null ? "—" : (x > 0 ? "+" : "") + Number(x).toFixed(d);
const odds = (o) => o == null ? "" : (o > 0 ? "+" + o : String(o));
const cls = (x) => x == null ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "";
const gclass = (g) => "g" + (g || "F")[0];

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function fail(el, e) { el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }

// tabs
const loaded = {};
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("on", s.id === b.dataset.t));
  if (!loaded[b.dataset.t]) { loaded[b.dataset.t] = true; ({pro: loadPro, ratings: loadRatings, splits: loadSplits, model: loadModel}[b.dataset.t] || (()=>{}))(); }
});

// ---------------- trends
function kpi(label, t, hint) {
  if (!t || (!t.n && !t.p)) return `<div class="kpi"><div class="lbl">${label}</div><div class="rec">—</div></div>`;
  return `<div class="kpi"><div class="lbl">${label}</div>
    <div class="rec">${t.w}-${t.l}${t.p ? "-" + t.p : ""} <span class="small">${pct(t.pct)}</span></div>
    <div class="sub">${hint === "su" ? "" : `ROI <b class="${cls(t.roi)}">${sgn(t.roi * 100)}%</b> · ${sgn(t.units)} u · `}p=${t.p_value ?? "—"}</div></div>`;
}
function shortRec(t) { return !t || !t.n ? "—" : `${t.w}-${t.l}-${t.p} <span class="muted">(${pct(t.pct, 0)}, ROI <span class="${cls(t.roi)}">${sgn(t.roi*100,0)}%</span>)</span>`; }

async function runQuery() {
  const el = $("#result");
  el.innerHTML = `<div class="spinner">Buscando…</div>`;
  const p = new URLSearchParams({ q: $("#q").value });
  if ($("#desde").value) p.set("desde", $("#desde").value);
  if ($("#hasta").value) p.set("hasta", $("#hasta").value);
  if ($("#testdesde").value) p.set("test_desde", $("#testdesde").value);
  try {
    const r = await api("/api/query?" + p);
    const a = r.all;
    let h = `<div class="card"><div class="muted small">${r.games} partidos · ${r.rows} filas equipo</div>
      ${r.warnings.map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
      <div class="kpis" style="margin-top:8px">${kpi("Under", a.under)}${kpi("Over", a.over)}${kpi("ATS", a.ats)}${kpi("Moneyline", a.ml)}${kpi("Récord SU", a.su, "su")}</div></div>`;
    if (r.split) {
      const s = r.split;
      h += `<div class="card"><b>¿Aguanta fuera de muestra?</b> <span class="muted small">antes de ${s.test_from} vs desde ${s.test_from}</span>
        <div class="scroll"><table><tr><th></th><th>Antes</th><th>Desde ${s.test_from}</th></tr>
        ${["under","over","ats"].map((k) => `<tr><td>${k.toUpperCase()}</td><td>${shortRec(s.train[k])}</td><td>${shortRec(s.test[k])}</td></tr>`).join("")}
        </table></div></div>`;
    }
    if (r.upcoming.length) {
      h += `<div class="card"><b>Partidos por jugar que cumplen el filtro</b><div class="scroll"><table>
        <tr><th>Fecha</th><th>Equipo</th><th class="num">Línea</th><th class="num">Total</th><th class="num">Viento pron.</th></tr>
        ${r.upcoming.map((g) => `<tr><td>${g.date}</td><td>${g.team} ${g.home ? "vs" : "@"} ${g.opp}</td><td class="num">${sgn(g.line)}</td><td class="num">${g.total_line ?? "—"}</td><td class="num">${g.wind_fcst ?? "—"}</td></tr>`).join("")}
        </table></div></div>`;
    }
    h += `<div class="card"><b>Por temporada</b><div class="scroll"><table>
      <tr><th>Temp.</th><th>ATS</th><th>Under</th><th style="width:30%"></th></tr>
      ${r.by_season.slice().reverse().map((s) => { const u = s.under; const w = u.n ? u.pct * 100 : 0;
        return `<tr><td>${s.season}</td><td>${s.ats.n ? `${s.ats.w}-${s.ats.l}-${s.ats.p}` : "—"}</td><td>${u.n ? `${u.w}-${u.l}-${u.p} (${pct(u.pct,0)})` : "—"}</td>
        <td><div class="bar"><i style="width:${w}%;background:${w >= 52.4 ? "var(--good)" : "var(--bad)"}"></i></div></td></tr>`; }).join("")}
      </table></div></div>`;
    h += `<div class="card"><b>Últimos partidos</b><div class="scroll"><table>
      <tr><th>Fecha</th><th>Partido</th><th class="num">Marcador</th><th class="num">Línea</th><th class="num">Total</th><th class="num">Viento</th></tr>
      ${r.recent.map((g) => `<tr><td>${g.date}</td><td>${g.team} ${g.home ? "vs" : "@"} ${g.opp}</td><td class="num">${g.pts}-${g.opp_pts}</td>
        <td class="num ${g.covered === 1 ? "pos" : g.covered === 0 ? "neg" : ""}">${sgn(g.line)}</td>
        <td class="num ${g.over === 0 ? "pos" : ""}">${g.total}/${g.total_line ?? "—"} ${g.over === 1 ? "O" : g.over === 0 ? "U" : ""}</td>
        <td class="num">${g.wind ?? "—"}</td></tr>`).join("")}
      </table></div></div>`;
    el.innerHTML = h;
  } catch (e) { fail(el, e); }
}
$("#run").onclick = runQuery;
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runQuery(); });

// ---------------- projections
async function loadPro() {
  const el = $("#presult");
  el.innerHTML = `<div class="spinner">Calculando…</div>`;
  const p = new URLSearchParams();
  if ($("#pseason").value) p.set("season", $("#pseason").value);
  if ($("#pweek").value) p.set("week", $("#pweek").value);
  try {
    const r = await api("/api/projections?" + p);
    $("#pseason").placeholder = r.season; $("#pweek").placeholder = "Semana " + r.week;
    let h = `<div class="muted small" style="margin-bottom:10px">Temporada ${r.season} · semana ${r.week}. Línea PRO = lo que el modelo cree justo;
      "modelo puro" = sus ratings sin ajustar al mercado. El grade sale del valor esperado al precio ofrecido.</div>`;
    for (const g of r.games) {
      const b = (m, s) => g.bets.find((x) => x.market === m && x.side === s);
      const line = (label, pro, bet, fmtLine) => !bet ? "" : `<div class="gl"><div><b>${label}</b></div><div class="pro">${pro}</div>
        <div class="odds">${fmtLine}<small>${odds(bet.odds)}</small></div><div class="grade ${gclass(bet.grade)}" title="prob ${pct(bet.prob)} · EV ${sgn(bet.ev*100)}%">${bet.grade}</div></div>`;
      const hs = b("spread","home"), as = b("spread","away"), ov = b("total","over"), un = b("total","under"), hm = b("ml","home"), am = b("ml","away");
      const pick = g.bets.slice().sort((x, y) => y.ev - x.ev)[0];
      const who = (s) => s === "home" ? g.home : s === "away" ? g.away : s === "over" ? "Over" : "Under";
      const blurb = g.market_spread_home != null ? `El modelo pone el spread <b>${g.home} ${sgn(g.proj_spread_home)}</b> (modelo puro ${sgn(g.raw_spread_home)}), el mercado <b>${g.home} ${sgn(g.market_spread_home)}</b>.
        Total modelo <b>${g.proj_total}</b> (puro ${g.raw_total}) vs <b>${g.market_total ?? "—"}</b>.${pick && pick.ev >= 0 ? ` Mejor valor: <b>${who(pick.side)} ${pick.market}</b> (${pick.grade}).` : " Sin valor claro contra este precio."}` : "Sin línea de mercado todavía.";
      h += `<div class="game"><h3>${g.away} @ ${g.home}</h3>
        <div class="meta">${g.date}${g.wind != null ? ` · viento ${Math.round(g.wind)} mph` : ""}${g.final ? ` · final ${g.away} ${g.final.split("-")[0]} – ${g.home} ${g.final.split("-")[1]}` : ""}</div>
        <div class="blurb">${blurb}</div>
        <div class="gl head" style="border:0"><div>Mercado</div><div class="pro">PRO</div><div style="text-align:center">Momio</div><div style="text-align:center">Grade</div></div>
        ${line(g.away, sgn(-g.proj_spread_home), as, as ? sgn(as.line) : "")}
        ${line(g.home, sgn(g.proj_spread_home), hs, hs ? sgn(hs.line) : "")}
        ${line("Over", g.proj_total, ov, ov ? "o" + ov.line : "")}
        ${line("Under", g.proj_total, un, un ? "u" + un.line : "")}
        ${line(g.away + " ML", odds(g.proj_ml_away), am, "ML")}
        ${line(g.home + " ML", odds(g.proj_ml_home), hm, "ML")}
      </div>`;
    }
    el.innerHTML = h;
  } catch (e) { fail(el, e); }
}
$("#prun").onclick = loadPro;

// ---------------- ratings
async function loadRatings() {
  const el = $("#rresult");
  try {
    const r = await api("/api/ratings");
    el.innerHTML = `<div class="muted small">Puntos vs un equipo promedio en cancha neutral.</div><div class="scroll"><table>
      <tr><th>#</th><th>Equipo</th><th class="num">Rating</th><th class="num">Resultados</th><th class="num">Mercado</th><th class="num">Ofensiva</th><th class="num">Defensa*</th></tr>
      ${r.map((t, i) => `<tr><td>${i + 1}</td><td><b>${t.team}</b></td><td class="num"><b>${sgn(t.rating)}</b></td><td class="num">${sgn(t.results)}</td>
        <td class="num">${sgn(t.market)}</td><td class="num">${sgn(t.off)}</td><td class="num">${sgn(t.def)}</td></tr>`).join("")}
      </table></div><div class="muted small">*Defensa: puntos permitidos sobre el promedio (negativo = mejor).</div>`;
  } catch (e) { fail(el, e); }
}

// ---------------- splits
async function loadSplits() {
  try {
    const up = await api("/api/upcoming");
    $("#sgame").innerHTML = up.map((g) => `<option value="${g.game_id}">${g.gameday} · ${g.away_team} @ ${g.home_team} (sem ${g.week})</option>`).join("");
  } catch (e) { $("#smsg").textContent = e.message; }
  try {
    const s = await api("/api/splits");
    $("#slist").innerHTML = !s.length ? `<div class="muted">Aún no guardas splits.</div>` : `<div class="scroll"><table>
      <tr><th>Partido</th><th class="num">Tickets local</th><th class="num">Dinero local</th><th class="num">Tickets over</th><th class="num">Dinero over</th><th>Fuente</th></tr>
      ${s.map((x) => `<tr><td>${x.away_team} @ ${x.home_team}<div class="small muted">${x.captured_at}</div></td><td class="num">${x.home_bets_pct ?? "—"}</td><td class="num">${x.home_money_pct ?? "—"}</td>
        <td class="num">${x.over_bets_pct ?? "—"}</td><td class="num">${x.over_money_pct ?? "—"}</td><td>${esc(x.source)}</td></tr>`).join("")}</table></div>`;
  } catch (e) { fail($("#slist"), e); }
}
$("#sadd").onclick = async () => {
  const body = { game: $("#sgame").value, source: $("#ssrc").value, home_bets_pct: $("#hb").value, home_money_pct: $("#hm").value,
    over_bets_pct: $("#ob").value, over_money_pct: $("#om").value };
  try { const r = await api("/api/splits", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    $("#smsg").textContent = "Guardado: " + r.game_id; ["#hb","#hm","#ob","#om"].forEach((s) => $(s).value = ""); loadSplits();
  } catch (e) { $("#smsg").textContent = e.message; }
};

// ---------------- model
async function loadModel() {
  const el = $("#bresult");
  try {
    const r = await api("/api/backtest");
    const e = r.evaluation, p = r.backtest_params;
    const grades = ["A","A-","B+","B","B-","C+","C","D+","D","F"];
    const tbl = (m) => { const rows = e.by_grade.filter((x) => x.market === m);
      return `<table><tr><th>Grade</th><th class="num">Récord</th><th class="num">%</th><th class="num">ROI</th></tr>
      ${grades.map((g) => rows.find((x) => x.grade === g)).filter(Boolean).map((x) => `<tr><td><span class="grade ${gclass(x.grade)}" style="display:inline-block;width:40px;padding:4px 0;font-size:16px">${x.grade}</span></td>
        <td class="num">${x.w}-${x.l}-${x.p}</td><td class="num">${pct(x.pct)}</td><td class="num ${cls(x.roi)}">${sgn(x.roi*100)}%</td></tr>`).join("")}</table>`; };
    el.innerHTML = `<div class="card"><b>Backtest honesto</b> <span class="muted small">entrenado antes de ${r.test_from}, probado ${e.seasons[0]}–${e.seasons[e.seasons.length-1]}, sin ver el futuro</span>
      <div class="kpis" style="margin-top:10px">
        <div class="kpi"><div class="lbl">Error spread</div><div class="rec">${e.rmse_spread_model}</div><div class="sub">línea de cierre: ${e.rmse_spread_market}</div></div>
        <div class="kpi"><div class="lbl">Error total</div><div class="rec">${e.rmse_total_model}</div><div class="sub">línea de cierre: ${e.rmse_total_market}</div></div>
        <div class="kpi"><div class="lbl">Cuánto confía vs mercado</div><div class="rec">${(r.params.k_spread*100).toFixed(0)}% / ${(r.params.k_total*100).toFixed(0)}%</div><div class="sub">spread / total</div></div>
        <div class="kpi"><div class="lbl">Viento vs mercado</div><div class="rec">${sgn(r.params.wind_coef_mkt,2)}</div><div class="sub">pts por mph arriba de 8</div></div>
      </div>
      <div class="warn">Si el error del modelo no es menor que el de la línea de cierre, el modelo no le gana al mercado en general. Úsalo para encontrar desacuerdos y confírmalos con tendencias, clima y splits.</div></div>
      <div class="grid3"><div class="card"><b>Spread</b>${tbl("spread")}</div><div class="card"><b>Totales</b>${tbl("total")}</div><div class="card"><b>Moneyline</b>${tbl("ml")}</div></div>`;
  } catch (e) { fail(el, e); }
}
$("#bupd").onclick = async () => { const b = $("#bupd"); b.disabled = true; $("#bmsg").textContent = "Descargando…";
  try { const r = await api("/api/update", { method: "POST", body: "{}" }); $("#bmsg").textContent = "Listo: " + JSON.stringify(r); meta(); }
  catch (e) { $("#bmsg").textContent = e.message; } b.disabled = false; };
$("#btrain").onclick = async () => { const b = $("#btrain"); b.disabled = true; $("#bmsg").textContent = "Entrenando (~10 s)…";
  try { await api("/api/train", { method: "POST", body: "{}" }); $("#bmsg").textContent = "Modelo entrenado."; loadModel(); }
  catch (e) { $("#bmsg").textContent = e.message; } b.disabled = false; };

// ---------------- theme (auto / claro / oscuro), remembered per browser
const THEMES = ["auto", "light", "dark"], LABEL = { auto: "Auto", light: "Día", dark: "Noche" };
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = LABEL[t];
}
let theme = "auto";
try { theme = localStorage.getItem("sl-theme") || "auto"; } catch (e) {}
applyTheme(theme);
$("#theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme(theme);
  try { localStorage.setItem("sl-theme", theme); } catch (e) {}
};

// ---------------- boot
async function meta() {
  try {
    const m = await api("/api/meta");
    $("#dbinfo").textContent = m.games ? `${m.games.toLocaleString()} partidos · ${m.seasons[0]}–${m.seasons[m.seasons.length - 1]}` : "sin datos: toca Modelo → Actualizar";
    $("#examples").innerHTML = m.examples.map((x) => `<span class="chip" data-q="${esc(x.q)}">${esc(x.label)}</span>`).join("");
    $("#examples").querySelectorAll(".chip").forEach((c) => c.onclick = () => { $("#q").value = c.dataset.q; runQuery(); });
    $("#fields").innerHTML = m.fields.map((f) => `<div><code>${f.name}</code> <span class="muted">${esc(f.desc)}</span></div>`).join("");
    $("#fields").querySelectorAll("code").forEach((c) => c.onclick = () => { const q = $("#q"); q.value = (q.value.trim() ? q.value.trim() + " and " : "") + c.textContent + " "; q.focus(); });
    if (m.games) runQuery();
  } catch (e) { fail($("#result"), e); }
}
meta();
</script>
